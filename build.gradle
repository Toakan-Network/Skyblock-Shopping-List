plugins {
	id 'net.fabricmc.fabric-loom' version '1.17.21'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	maven { url = "https://repo.nea.moe/releases" }
	maven { url = "https://repo.hypixel.net/repository/Hypixel/" }
	maven { url = "https://maven.isxander.dev/releases" }
	// SkyblockAPI (ThatGravyBoat): sacks, storage, profile and repo data, bundled below.
	maven { url = "https://maven.teamresourceful.com/repository/maven-public/" }
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// NEU repo-parser: typed access to NotEnoughUpdates-REPO items and recipes
	// 'include' bundles it inside the mod JAR via Fabric Jar-in-Jar so it is
	// available at runtime without requiring a separate mod on the classpath.
	include implementation("moe.nea:neurepoparser:1.9.0")

	// Official Hypixel Mod API, used for SkyBlock detection. Required at runtime ("depends" in
	// fabric.mod.json); players install the hypixel-mod-api mod themselves, so it is compile-only, not bundled.
	compileOnly "net.hypixel:mod-api:1.0.2"

	// SkyblockAPI: SkyBlock data readers maintained upstream (sacks, storage, forge, recipes via its bundled
	// Repo-Lib). One build per Minecraft version, picked by capability; bundled with Jar-in-Jar (it is not on
	// Modrinth), and Fabric loads the newest copy when other mods bundle it too. Needs fabric-language-kotlin.
	// The version is written out in full so Dependabot can bump it. Not transitive: its runtime metadata lists
	// dev-only mods (DevAuth); what it needs at runtime is nested in its own jar or installed by the player.
	implementation("tech.thatgravyboat:skyblock-api:4.2.37") {
		transitive = false
		capabilities { requireCapability("tech.thatgravyboat:skyblock-api-26.2") }
	}
	include("tech.thatgravyboat:skyblock-api:4.2.37") {
		transitive = false
		capabilities { requireCapability("tech.thatgravyboat:skyblock-api-26.2") }
	}
	// Compile against what SkyblockAPI exposes: Repo-Lib (nested in its jar) and the Kotlin standard library
	// (from fabric-language-kotlin, installed by the player).
	compileOnly "tech.thatgravyboat.repo-lib:repo-lib:4.1.11"
	compileOnly "org.jetbrains.kotlin:kotlin-stdlib:2.4.0"

	// YetAnotherConfigLib for the Settings screen. Required at runtime ("depends" in fabric.mod.json), not bundled.
	implementation "dev.isxander:yet-another-config-lib:${project.yacl_version}"

}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
	from("NOTICE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}