plugins {
	id 'net.fabricmc.fabric-loom' version '1.17.21'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	maven { url = "https://repo.nea.moe/releases" }
	maven { url = "https://repo.hypixel.net/repository/Hypixel/" }
	maven { url = "https://maven.isxander.dev/releases" }
	maven {
		url = "https://maven.operationpotato.com/releases"
		content { includeGroup "com.operationpotato" }
	}
	maven {
		url = "https://maven.terraformersmc.com/releases"
		content { includeGroup "com.terraformersmc" }
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// NEU repo-parser: typed access to NotEnoughUpdates-REPO items and recipes
	// 'include' bundles it inside the mod JAR via Fabric Jar-in-Jar so it is
	// available at runtime without requiring a separate mod on the classpath.
	include implementation("moe.nea:neurepoparser:1.9.0")

	// Official Hypixel Mod API, used for SkyBlock detection. Required at runtime ("depends" in
	// fabric.mod.json); players install the hypixel-mod-api mod themselves, so it is compile-only, not bundled.
	compileOnly "net.hypixel:mod-api:1.0.2"

	// SkyBlock Item List plugin API (optional): adds a "☰" button to its recipes and keeps its item grid off the
	// HUD panels. Only ItemList ever loads uk.toakan.tad.skyblockshoppinglist.compat.ItemListPlugin (fabric.mod.json entrypoint),
	// so nothing here is needed without it.
	compileOnly "com.operationpotato:skyblock-item-list-api:${project.itemlist_version}"

	// Mod Menu (optional): its "Configure" button opens Settings. Only Mod Menu loads
	// uk.toakan.tad.skyblockshoppinglist.compat.ModMenuCompat (fabric.mod.json entrypoint).
	compileOnly("com.terraformersmc:modmenu:${project.modmenu_version}") { transitive = false }

	// YetAnotherConfigLib for the Settings screen. Required at runtime ("depends" in fabric.mod.json), not bundled.
	implementation "dev.isxander:yet-another-config-lib:${project.yacl_version}"

	// Unit tests for the plain logic (counts, names, recipe graph); nothing here ships in the jar.
	testImplementation platform("org.junit:junit-bom:5.14.2")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"

}

// Huddable (optional): its editor places the HUD panels when installed. Huddable isn't on a Maven repo, so its API
// is compiled from signature-only copies in src/huddableStub and left out of the jar; only Huddable ever loads
// uk.toakan.tad.skyblockshoppinglist.compat.HuddableCompat (fabric.mod.json entrypoint).
sourceSets.main.java.srcDir "src/huddableStub/java"

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

test {
	useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	exclude "uk/toakan/tad/huddable/**"
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
	from("NOTICE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}