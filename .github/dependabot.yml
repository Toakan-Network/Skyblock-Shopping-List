# Watches the bundled SkyblockAPI library for new releases and opens a pull request to bump it.
# Dependabot reads this file from the default branch, so it only runs once it is there.
version: 2
registries:
  teamresourceful:
    type: maven-repository
    url: https://maven.teamresourceful.com/repository/maven-public/
updates:
  - package-ecosystem: gradle
    directory: "/"
    registries:
      - teamresourceful
    schedule:
      interval: weekly
    allow:
      - dependency-name: "tech.thatgravyboat:skyblock-api"
    ignore:
      # A new minor version means a new Minecraft version (4.1 = 26.1, 4.2 = 26.2); port those by hand.
      - dependency-name: "tech.thatgravyboat:skyblock-api"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    commit-message:
      prefix: "SkyblockAPI"
